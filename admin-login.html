<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Brew & Bliss | Admin Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap"
        rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Poppins", Arial, sans-serif;
            background: #f3ebe4;
            color: #3b2418;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand h1 {
            font-family: "Playfair Display", Georgia, serif;
            font-size: 42px;
            color: #5a3825;
        }

        .brand p {
            margin-top: 5px;
            color: #806f64;
            font-size: 14px;
        }

        .login-card {
            background: white;
            padding: 35px;
            border-radius: 20px;

            box-shadow:
                0 15px 40px rgba(59, 36, 24, 0.12);
        }

        .login-card h2 {
            font-family: "Playfair Display", Georgia, serif;
            font-size: 27px;
            margin-bottom: 8px;
        }

        .login-card .description {
            color: #806f64;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 7px;
            color: #5a3825;
        }

        input {
            width: 100%;
            padding: 13px 14px;

            border: 1px solid #d8c8bd;
            border-radius: 10px;

            font-family: inherit;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #8f5d28;
        }

        .login-button {
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 10px;

            background: #5a3825;
            color: white;

            font-family: inherit;
            font-size: 14px;
            font-weight: 600;

            cursor: pointer;
            transition: 0.2s;
        }

        .login-button:hover {
            background: #6f4e37;
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-message {
            display: none;

            margin-bottom: 18px;
            padding: 12px;

            border-radius: 10px;

            background: #fbe9e7;
            color: #b23b2f;

            font-size: 13px;
            text-align: center;
        }

        .back-link {
            display: block;
            text-align: center;

            margin-top: 20px;

            color: #6f4e37;
            text-decoration: none;

            font-size: 13px;
            font-weight: 600;
        }

        .back-link:hover {
            color: #b57b35;
        }

    </style>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Your existing Supabase connection -->
    <script src="js/supabase.js"></script>

</head>

<body>

    <div class="login-container">

        <div class="brand">

            <h1>Brew & Bliss</h1>

            <p>Admin Portal</p>

        </div>


        <div class="login-card">

            <h2>Admin Login</h2>

            <p class="description">
                Sign in to access the order management dashboard.
            </p>


            <div
                id="error-message"
                class="error-message">
            </div>


            <form id="login-form">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required>

                </div>


                <button
                    type="submit"
                    class="login-button"
                    id="login-button">

                    Login

                </button>

            </form>


            <a
                href="index.html"
                class="back-link">

                ← Back to Brew & Bliss

            </a>

        </div>

    </div>


    <script>

        const loginForm =
            document.getElementById("login-form");

        const emailInput =
            document.getElementById("email");

        const passwordInput =
            document.getElementById("password");

        const loginButton =
            document.getElementById("login-button");

        const errorMessage =
            document.getElementById("error-message");


        loginForm.addEventListener("submit", async function(event) {

            event.preventDefault();


            const email =
                emailInput.value.trim();

            const password =
                passwordInput.value;


            errorMessage.style.display = "none";

            loginButton.disabled = true;

            loginButton.textContent = "Signing in...";


            const { data, error } =
                await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });


            if (error) {

                console.error("Login error:", error);

                errorMessage.textContent =
                    "Invalid email or password.";

                errorMessage.style.display = "block";

                loginButton.disabled = false;

                loginButton.textContent = "Login";

                return;
            }


            console.log("Login successful:", data.user);


            window.location.href = "admin.html";

        });

    </script>

</body>

</html>
