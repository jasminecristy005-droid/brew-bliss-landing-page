<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Brew & Bliss | Admin Orders</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Poppins", Arial, sans-serif;
            background: #f3ebe4;
            color: #3b2418;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .admin-container {
            max-width: 1100px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand {
            font-family: "Playfair Display", Georgia, serif;
            font-size: 38px;
            font-weight: 700;
            color: #5a3825;
        }

        .subtitle {
            color: #806f64;
            margin-top: 5px;
        }

        .dashboard {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 15px 40px rgba(59, 36, 24, 0.12);
        }

        .dashboard-title {
            font-family: "Playfair Display", Georgia, serif;
            font-size: 26px;
            margin-bottom: 20px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th {
            background: #5a3825;
            color: white;
            padding: 14px;
            text-align: left;
            font-size: 14px;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #eadfd7;
            font-size: 14px;
        }

        tr:hover {
            background: #fffaf6;
        }

        .status {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: #f3ebe4;
            color: #6f4e37;
        }

        .empty-message {
            text-align: center;
            padding: 40px 20px;
            color: #806f64;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #6f4e37;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            color: #b57b35;
        }
.order-notification {
display: inline-block;
margin-bottom: 20px;
padding: 10px 16px;
border-radius: 20px;
background: #f3ebe4;
color: #6f4e37;
font-size: 14px;
font-weight: 600;
}

.order-notification span {
display: inline-flex;
align-items: center;
justify-content: center;
min-width: 26px;
height: 26px;
margin-left: 5px;
padding: 0 7px;
border-radius: 50%;
background: #b57b35;
color: white;
font-size: 12px;
}
.status-summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.summary-card {
    background: #fffaf6;
    border: 1px solid #eadfd7;
    border-radius: 16px;
    padding: 18px;
    text-align: center;
}

.summary-icon {
    display: block;
    font-size: 24px;
    margin-bottom: 6px;
}

.summary-label {
    display: block;
    color: #806f64;
    font-size: 12px;
    margin-bottom: 5px;
}

.summary-card strong {
    display: block;
    color: #5a3825;
    font-size: 24px;
    font-weight: 700;
}
        @media (max-width: 700px) {
.status-summary {
    grid-template-columns: repeat(2, 1fr);
}
            body {
                padding: 25px 15px;
            }

            .brand {
                font-size: 30px;
            }

            .dashboard {
                padding: 18px;
            }
        }
        .status-select {
    padding: 8px 12px;
    border: 1px solid #d8c8bd;
    border-radius: 20px;
    background: #f3ebe4;
    color: #6f4e37;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    outline: none;
}

.status-select:focus {
    border-color: #b57b35;
}
.clear-button {
    margin-top: 20px;
    padding: 10px 18px;
    border: none;
    border-radius: 20px;
    background: #8f5d28;
    color: white;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
}

.clear-button:hover {
    background: #6f4e37;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
</head>

<body>

    <div class="admin-container">

        <div class="header">
            <div class="brand">Brew & Bliss</div>
            <p class="subtitle">Order Management Dashboard</p>
        </div>

        <div class="dashboard">

            <h2 class="dashboard-title">
    Customer Orders
</h2>

<div class="order-notification">
    🔔 New Orders:
    <span id="new-order-count">0</span>
</div>
<div class="status-summary">

    <div class="summary-card">
        <span class="summary-icon">🆕</span>
        <span class="summary-label">New Orders</span>
        <strong id="summary-new">0</strong>
    </div>

    <div class="summary-card">
        <span class="summary-icon">☕</span>
        <span class="summary-label">Preparing</span>
        <strong id="summary-processing">0</strong>
    </div>

    <div class="summary-card">
        <span class="summary-icon">✅</span>
        <span class="summary-label">Ready</span>
        <strong id="summary-ready">0</strong>
    </div>

    <div class="summary-card">
        <span class="summary-icon">🎉</span>
        <span class="summary-label">Completed</span>
        <strong id="summary-completed">0</strong>
    </div>

</div>

                <table>

                <thead>
    <tr>
        <th>Order ID</th>
        <th>Customer</th>
        <th>Coffee</th>
        <th>Qty</th>
        <th>Order Type</th>
        <th>Date</th>
        <th>Status</th>
    </tr>
</thead>

<tbody id="orders-table">
</tbody>    

                </table>

        </div>

        <a href="index.html" class="back-link">
            ← Back to Brew & Bliss
        </a>
        <button onclick="clearOrders()" class="clear-button">
    Clear All Test Orders
</button>

    </div>

</body>
<script>

const ordersTable = document.getElementById("orders-table");

async function loadOrders() {

    const { data: orders, error } = await supabaseClient
        .from("orders")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
        console.error("Error loading orders:", error);
        ordersTable.innerHTML = `
            <tr>
                <td colspan="7" style="text-align:center; padding:30px;">
                    Failed to load orders.
                </td>
            </tr>
        `;
        return;
    }

    ordersTable.innerHTML = "";

    // =========================
    // STATUS COUNTS
    // =========================

    const newOrderCount =
        orders.filter(order => order.status === "New Order").length;

    const processingCount =
        orders.filter(order => order.status === "Processing").length;

    const readyCount =
        orders.filter(order => order.status === "Ready/Served").length;

    const completedCount =
        orders.filter(order => order.status === "Completed").length;


    document.getElementById("new-order-count").textContent =
        newOrderCount;

    document.getElementById("summary-new").textContent =
        newOrderCount;

    document.getElementById("summary-processing").textContent =
        processingCount;

    document.getElementById("summary-ready").textContent =
        readyCount;

    document.getElementById("summary-completed").textContent =
        completedCount;


    // =========================
    // NO ORDERS
    // =========================

    if (!orders || orders.length === 0) {

        ordersTable.innerHTML = `
            <tr>
                <td colspan="7" style="text-align:center; padding:30px;">
                    No orders yet.
                </td>
            </tr>
        `;

        return;
    }


    // =========================
    // DISPLAY ORDERS
    // =========================

    orders.forEach(order => {

        const row = document.createElement("tr");

        const customerName =
            `${order.first_name || ""} ${order.last_name || ""}`.trim()
            || order.customer_name
            || "Unknown";

        const orderDate = order.created_at
            ? new Date(order.created_at).toLocaleString()
            : "—";

        row.innerHTML = `
            <td>${order.order_id || "—"}</td>

            <td>
                ${customerName}
            </td>

            <td>${order.product || order.items || "—"}</td>

            <td>${order.quantity || "—"}</td>

            <td>—</td>

            <td>${orderDate}</td>

            <td>

                <select
                    class="status-select"
                    data-order-id="${order.order_id}">

                    <option value="New Order"
                        ${order.status === "New Order" ? "selected" : ""}>
                        New Order
                    </option>

                    <option value="Processing"
                        ${order.status === "Processing" ? "selected" : ""}>
                        Processing
                    </option>

                    <option value="Ready/Served"
                        ${order.status === "Ready/Served" ? "selected" : ""}>
                        Ready/Served
                    </option>

                    <option value="Completed"
                        ${order.status === "Completed" ? "selected" : ""}>
                        Completed
                    </option>

                </select>

            </td>
        `;

        ordersTable.appendChild(row);

    });


    // =========================
    // STATUS CHANGE
    // =========================

    document.querySelectorAll(".status-select")
        .forEach(select => {

            select.addEventListener("change", async function () {

                const orderId =
                    this.dataset.orderId;

                const newStatus =
                    this.value;


                const { error } = await supabaseClient
                    .from("orders")
                    .update({
                        status: newStatus
                    })
                    .eq("order_id", orderId);


                if (error) {

                    console.error(
                        "Error updating order:",
                        error
                    );

                    alert(
                        "Failed to update order status."
                    );

                    return;
                }


                alert(
                    "Order " +
                    orderId +
                    " updated to " +
                    newStatus
                );


                // Reload orders from Supabase
                loadOrders();

            });
    });

}

loadOrders();

function clearOrders() {

    const confirmClear = confirm(
        "Are you sure you want to delete all test orders?"
    ); 


    if (confirmClear) {

        localStorage.removeItem("brewBlissOrders");

        loadOrders();

    }

}

</script>
</html>
